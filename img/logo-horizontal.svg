    <g transform="translate(122, 10)">
      <!-- "Kid" -->
      <text x="0" y="42" font-family="'Fredoka', 'Bubblegum Sans', 'Outfit', sans-serif" font-weight="700" font-size="44" fill="#2D2B2A" letter-spacing="-0.5">Kid</text>
