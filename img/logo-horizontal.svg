    <path d="M 28 8 C 12 8 0 20 0 36 C 0 52 12 64 28 64 C 36 64 43 60 48 54 C 53 60 60 64 68 64 C 84 64 96 52 96 36 C 96 23 87 12 75 9 C 71 18 64 25 55 28 C 64 31 71 38 75 47 C 66 43 59 36 55 27 C 51 36 44 43 35 47 C 39 38 46 31 55 28 C 46 25 39 18 35 9 C 32 8 30 8 28 8 Z" fill="#F14C19" opacity="0"/>
