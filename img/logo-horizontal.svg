      <path d="M 28 5 C 10 5 0 20 0 38 C 0 54 10 68 28 68 C 39 68 47 62 52 54 C 57 62 67 68 80 68 C 96 68 108 54 108 38 C 108 22 94 8 76 6 C 70 16 62 25 52 28 C 62 31 72 40 76 50 C 66 45 57 37 52 28 C 47 37 38 45 28 50 C 32 40 42 31 52 28 C 42 25 34 16 28 5 Z" fill="#F14C19"/>
